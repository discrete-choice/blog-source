baseurl: "https://discrete-choice.github.io/"
languageCode: "zh-cn"
title: "Discrete Choice"
theme: "hugo-theme-stack"

# 文章链接格式
permalinks:
  post: "/post/:year/:month/:day/:slug/"

# 允许 Markdown 中写 HTML
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["\\(", "\\)"]
            - ["$", "$"]
  highlight:
    noClasses: false

# 忽略 R 的源文件
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]

# ===== 注意：菜单必须放在最外层，不能放在 params 里面 =====
menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 2
    - identifier: about
      name: 关于
      url: /about/
      weight: 3

# 侧边栏、头像等核心参数设置
params:
  # 文章页设置
  article:
    headingAnchor: false
    math: true  
  
  # 底部版权信息
  footer:
    since: 2026
    customText: "© Discrete Choice"

  # 日期格式
  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02"

  # 侧边栏设置
  sidebar:
    subtitle: "我亦是行人"
    avatar: ""
    
  # 左侧底部小挂件
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
